<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relaysim</title>
<style>
:root {
  --bg: #f4f5f3;
  --surface: #ffffff;
  --ink: #1a1f1c;
  --muted: #6b756e;
  --line: #d5dbd6;
  --line-strong: #9aa39c;
  --live: #1f8a4c;
  --live-soft: #e3f5ea;
  --phase: #c0392b;
  --neutral: #2c6cb0;
  --accent: #1a1f1c;
  --warn: #b45309;
  --danger: #b91c1c;
  --danger-bg: #fef2f2;
  --ok-bg: #ecfdf5;
  --grid: #d0d6d1;
  --logo: #3d4650;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* —— Toolbar —— */
.bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--surface);
  border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.bar .brand {
  font-family: var(--mono); font-weight: 600; font-size: 13px;
  letter-spacing: 0.04em; margin-right: 6px;
}
.bar button {
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); cursor: pointer;
  transition: background .12s, border-color .12s;
}
.bar button:hover { background: #f0f2f0; }
.bar button.pri { background: var(--ink); color: #fff; border-color: var(--ink); }
.bar button.pri:hover { background: #2c3530; }
.bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.bar .meta {
  margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted);
  display: flex; gap: 14px; align-items: center;
}
.bar select {
  font-family: var(--sans); font-size: 12px; padding: 5px 8px;
  border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface);
  color: var(--ink); cursor: pointer;
}

/* —— Layout —— */
.shell { flex: 1; display: flex; min-height: 0; }

.side {
  width: 320px; min-width: 280px; max-width: 380px;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--line); background: var(--surface); flex-shrink: 0;
}

.side-top {
  border-bottom: 1px solid var(--line); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.side-top h2 {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--mono); font-size: 11px; padding: 5px 10px;
  border-radius: 999px; border: 1px solid var(--line-strong);
  background: transparent; color: var(--ink); cursor: pointer;
  user-select: none; transition: all .12s;
}
.chip.on { background: var(--live-soft); border-color: var(--live); color: var(--live); font-weight: 600; }
.chip.mom { border-style: dashed; }
.hint { font-size: 11px; color: var(--muted); line-height: 1.4; }

.side-code { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.side-code h2 {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 8px 14px; border-bottom: 1px solid var(--line); background: #fafbfa;
}
#src {
  flex: 1; width: 100%; border: none; resize: none; padding: 12px 14px;
  font-family: var(--mono); font-size: 12px; line-height: 1.55;
  background: transparent; color: var(--ink); outline: none;
}
.side-foot {
  border-top: 1px solid var(--line); padding: 8px 14px;
  font-size: 10px; color: var(--muted); line-height: 1.45; background: #fafbfa;
}
.side-foot code { font-family: var(--mono); font-size: 10px; color: var(--ink); }

.canvas-wrap {
  flex: 1; position: relative; min-width: 0; background: #fafbfa;
  display: flex; flex-direction: column;
}
.canvas-scroll { flex: 1; overflow: auto; }
#svg { display: block; min-width: 100%; }
.toast {
  position: absolute; top: 12px; left: 12px; max-width: 420px; z-index: 5;
  display: none; padding: 10px 12px; border-radius: 6px;
  font-family: var(--mono); font-size: 11px; white-space: pre-wrap;
  border: 1px solid var(--danger); color: var(--danger); background: var(--danger-bg);
  box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.toast.ok { border-color: var(--live); color: var(--live); background: var(--ok-bg); }

.status {
  height: 26px; border-top: 1px solid var(--line); background: var(--surface);
  display: flex; align-items: center; padding: 0 14px;
  font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0;
}

@media (max-width: 860px) {
  .shell { flex-direction: column; }
  .side { width: 100%; max-width: none; max-height: 42vh; border-right: none; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>

<div class="bar">
  <span class="brand">relaysim</span>
  <button class="pri" id="btnParse">Interpretar</button>
  <button id="btnReset">Reiniciar</button>
  <span class="sep"></span>
  <button id="btnTick" title="Pausar o reanudar el reloj automático">Pausar reloj</button>
  <span class="sep"></span>
  <select id="examples" title="Cargar ejemplo">
    <option value="">Ejemplos…</option>
    <option value="lights">Secuencia LB1 → LB2 → LB3</option>
    <option value="motor">Motor + auto-retención + retardo</option>
    <option value="xor">Cargas exclusivas SA1/SA2</option>
    <option value="latch">Arranque / paro simple</option>
    <option value="seq">Secuencia A/B/C</option>
  </select>
  <div class="meta">
    <span id="tickLabel">t = 0.0 s</span>
    <span id="clockLabel" style="color:var(--live)">⏱ auto</span>
    <span id="runLabel">STOP</span>
  </div>
</div>

<div class="shell">
  <aside class="side">
    <div class="side-top">
      <h2>Entradas físicas</h2>
      <div class="chips" id="chips"></div>
      <p class="hint">Clic = conmutar. Pulsadores (SB…) se mantienen solo mientras pulsas.</p>
    </div>
    <div class="side-code">
      <h2>Programa</h2>
      <textarea id="src" spellcheck="false"></textarea>
      <div class="side-foot">
        <code>INPUT</code> · <code>COIL</code> · <code>LATCH SET() RESET()</code> ·
        <code>TIMER ONDELAY/OFFDELAY/PULSE</code> · <code>AND OR !</code>
      </div>
    </div>
  </aside>

  <main class="canvas-wrap">
    <div class="toast" id="toast"></div>
    <div class="canvas-scroll">
      <svg id="svg"></svg>
    </div>
    <div class="status" id="status">Listo</div>
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   Relaysim — motor + UI
   ═══════════════════════════════════════════════════════════ */

const EXAMPLES = {
lights: `# Secuencia automática: SB1 arranca, SB2 cancela
# LB1 → (2 s) → LB2 → (2 s) → LB3 → (2 s) → apagar todo
# 1 paso de TIMER = 1 segundo real (reloj automático)

INPUT SB1 SB2

LATCH RUN = SET(SB1) RESET(SB2 OR DONE)

TIMER T1 = ONDELAY(RUN, 2)
TIMER T2 = ONDELAY(T1, 2)
TIMER T3 = ONDELAY(T2, 2)

COIL LB1 = RUN AND !T3
COIL LB2 = T1 AND !T3
COIL LB3 = T2 AND !T3

COIL DONE = T3
`,

motor: `# Motor trifásico con LOGO! — auto-retención, interbloqueo y retardo
# SB1 marcha, SB2 paro, SA3 permiso, SQ1 fin de carrera (NC simulado)
INPUT SB1 SB2 SA3 SQ1

# Contactor KM1 con auto-retención; paro y fin de carrera cortan
LATCH KM1 = SET(SB1 AND SA3) RESET(SB2 OR !SQ1)

# Señalización: marcha y fallo de permiso
COIL EL1 = KM1
COIL EL2 = !SA3

# Tras 3 s con KM1 activo → listo
TIMER TON1 = ONDELAY(KM1, 3)
COIL EL3 = TON1
`,

xor: `# Dos cargas mutuamente excluyentes
INPUT SA1 SA2

COIL M1 = SA1 AND !SA2
COIL M2 = !SA1 AND SA2
COIL EL1 = M1
COIL EL2 = M2
`,

latch: `# Arranque / paro clásico
INPUT SB1 SB2

LATCH EL1 = SET(SB1) RESET(SB2)
`,

seq: `# Secuencia: A → espera → B → apaga
INPUT SB1 SB2

LATCH RUN = SET(SB1) RESET(SB2)
TIMER T1 = ONDELAY(RUN, 2)
COIL A = RUN AND !T1
COIL B = T1
TIMER T2 = OFFDELAY(RUN, 3)
COIL C = T2 AND !RUN
`
};

/* ─── Parser ─── */
function tokenize(s) {
  return s.replace(/([()!,])/g, ' $1 ').trim().split(/\s+/).filter(Boolean);
}

function parseExpr(tokens) {
  let i = 0;
  const peek = () => tokens[i];
  const next = () => tokens[i++];

  function parseOr() {
    let left = parseAnd();
    while (peek() === 'OR') {
      next();
      left = { type: 'or', children: [left, parseAnd()] };
    }
    return left;
  }
  function parseAnd() {
    let left = parseAtom();
    while (peek() === 'AND') {
      next();
      left = { type: 'and', children: [left, parseAtom()] };
    }
    return left;
  }
  function parseAtom() {
    if (peek() === '(') {
      next();
      const e = parseOr();
      if (peek() !== ')') throw new Error("Falta ')'");
      next();
      return e;
    }
    if (peek() === '!') {
      next();
      // allow !(expr) or !REF
      if (peek() === '(') {
        next();
        const e = parseOr();
        if (peek() !== ')') throw new Error("Falta ')' tras !");
        next();
        return { type: 'not', child: e };
      }
      const ref = next();
      if (!ref) throw new Error("Falta referencia tras '!'");
      return { type: 'contact', ref, no: false };
    }
    const ref = next();
    if (!ref) throw new Error('Expresión incompleta');
    if (['AND', 'OR', ')', ','].includes(ref)) throw new Error(`Token inesperado: ${ref}`);
    return { type: 'contact', ref, no: true };
  }

  const ast = parseOr();
  if (i !== tokens.length) throw new Error('Tokens sobrantes: ' + tokens.slice(i).join(' '));
  return ast;
}

function splitArgs(s) {
  // split by top-level commas
  const parts = [];
  let depth = 0, start = 0;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '(') depth++;
    else if (s[i] === ')') depth--;
    else if (s[i] === ',' && depth === 0) {
      parts.push(s.slice(start, i).trim());
      start = i + 1;
    }
  }
  parts.push(s.slice(start).trim());
  return parts;
}

function refsOf(node, set) {
  if (node.type === 'contact') { set.add(node.ref); return; }
  if (node.type === 'not') { refsOf(node.child, set); return; }
  node.children.forEach(c => refsOf(c, set));
}

function parseProgram(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const inputs = [];
  const coils = [];
  const latches = [];
  const timers = [];
  const declared = new Set();

  for (const line of lines) {
    if (line.startsWith('INPUT')) {
      line.slice(5).trim().split(/\s+/).filter(Boolean).forEach(r => {
        if (!inputs.includes(r)) inputs.push(r);
      });
      continue;
    }

    if (line.startsWith('COIL')) {
      const m = line.match(/^COIL\s+(\w+)\s*=\s*(.+)$/i);
      if (!m) throw new Error('COIL inválido: ' + line);
      if (declared.has(m[1])) throw new Error(`"${m[1]}" ya definido`);
      declared.add(m[1]);
      coils.push({ name: m[1], ast: parseExpr(tokenize(m[2])) });
      continue;
    }

    if (line.startsWith('LATCH')) {
      const m = line.match(/^LATCH\s+(\w+)\s*=\s*SET\s*\((.+)\)\s*RESET\s*\((.+)\)$/i);
      if (!m) throw new Error('LATCH: LATCH nombre = SET(expr) RESET(expr)');
      if (declared.has(m[1])) throw new Error(`"${m[1]}" ya definido`);
      declared.add(m[1]);
      latches.push({
        name: m[1],
        setAst: parseExpr(tokenize(m[2])),
        resetAst: parseExpr(tokenize(m[3]))
      });
      continue;
    }

    if (line.startsWith('TIMER')) {
      const m = line.match(/^TIMER\s+(\w+)\s*=\s*(ONDELAY|OFFDELAY|PULSE)\s*\((.+)\)$/i);
      if (!m) throw new Error('TIMER: TIMER n = ONDELAY|OFFDELAY|PULSE(expr, pasos)');
      if (declared.has(m[1])) throw new Error(`"${m[1]}" ya definido`);
      declared.add(m[1]);
      const kind = m[2].toUpperCase();
      const args = splitArgs(m[3]);
      if (args.length < 2) throw new Error('TIMER necesita expresión y pasos');
      if (!/^\d+$/.test(args[1])) throw new Error('Pasos deben ser entero');
      timers.push({
        name: m[1],
        kind: kind === 'OFFDELAY' ? 'off' : kind === 'PULSE' ? 'pulse' : 'on',
        inAst: parseExpr(tokenize(args[0])),
        preset: parseInt(args[1], 10)
      });
      continue;
    }

    throw new Error('Línea no reconocida: ' + line);
  }

  if (!coils.length && !latches.length && !timers.length) {
    throw new Error('Define al menos un COIL, LATCH o TIMER');
  }

  const known = new Set([...inputs, ...declared]);
  const used = new Set();
  coils.forEach(c => refsOf(c.ast, used));
  latches.forEach(l => { refsOf(l.setAst, used); refsOf(l.resetAst, used); });
  timers.forEach(t => refsOf(t.inAst, used));
  const unknown = [...used].filter(r => !known.has(r));
  if (unknown.length) throw new Error('No declarado: ' + unknown.join(', '));

  return { inputs, coils, latches, timers };
}

/* ─── Eval ─── */
function evalAst(node, st) {
  if (node.type === 'contact') return node.no ? !!st[node.ref] : !st[node.ref];
  if (node.type === 'not') return !evalAst(node.child, st);
  if (node.type === 'and') return node.children.every(c => evalAst(c, st));
  if (node.type === 'or') return node.children.some(c => evalAst(c, st));
  return false;
}

function settle(prog, st, max = 48) {
  for (let n = 0; n < max; n++) {
    let ch = false;
    for (const c of prog.coils) {
      const v = evalAst(c.ast, st);
      if (st[c.name] !== v) { st[c.name] = v; ch = true; }
    }
    for (const l of prog.latches) {
      const set = evalAst(l.setAst, st);
      const rst = evalAst(l.resetAst, st);
      let v = st[l.name];
      if (rst) v = false;
      else if (set) v = true;
      if (st[l.name] !== v) { st[l.name] = v; ch = true; }
    }
    if (!ch) return true;
  }
  return false;
}

function isMom(name) {
  return /^SB/i.test(name);
}

/* ─── State ─── */
let program = null;
let states = {};
let tCnt = {};      // timer counters
let tEdge = {};     // previous input for edge
let tArmed = {};    // pulse/off armed
let tick = 0;
let clockOn = true;           // reloj automático
let clockTimer = null;
const TICK_MS = 1000;         // 1 paso TIMER = 1 segundo real

function startClock() {
  stopClock();
  clockOn = true;
  const btn = document.getElementById('btnTick');
  const lab = document.getElementById('clockLabel');
  if (btn) btn.textContent = 'Pausar reloj';
  if (lab) { lab.textContent = '⏱ auto'; lab.style.color = 'var(--live)'; }
  clockTimer = setInterval(() => {
    if (!program || !clockOn) return;
    try {
      hideToast();
      runCycle(true);
      document.getElementById('tickLabel').textContent = 't = ' + tick.toFixed(1) + ' s';
      renderChips();
      drawAll();
    } catch (e) {
      showToast(e.message, false);
      stopClock();
    }
  }, TICK_MS);
}

function stopClock() {
  clockOn = false;
  if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
  const btn = document.getElementById('btnTick');
  const lab = document.getElementById('clockLabel');
  if (btn) btn.textContent = 'Reanudar reloj';
  if (lab) { lab.textContent = '⏱ pausa'; lab.style.color = 'var(--muted)'; }
}

function toggleClock() {
  if (clockOn) stopClock();
  else startClock();
}

function blankState(prog) {
  const st = {};
  prog.inputs.forEach(i => st[i] = false);
  prog.coils.forEach(c => st[c.name] = false);
  prog.latches.forEach(l => st[l.name] = false);
  prog.timers.forEach(t => st[t.name] = false);
  return st;
}

function updateTimersFromTick() {
  program.timers.forEach(t => {
    const raw = evalAst(t.inAst, states);
    const prev = !!tEdge[t.name];
    tEdge[t.name] = raw;

    if (t.kind === 'on') {
      if (raw) tCnt[t.name] = Math.min((tCnt[t.name] || 0) + 1, t.preset);
      else tCnt[t.name] = 0;
      states[t.name] = (tCnt[t.name] || 0) >= t.preset;
    } else if (t.kind === 'off') {
      if (raw) {
        states[t.name] = true;
        tCnt[t.name] = 0;
        tArmed[t.name] = true;
      } else if (tArmed[t.name]) {
        tCnt[t.name] = Math.min((tCnt[t.name] || 0) + 1, t.preset);
        states[t.name] = (tCnt[t.name] || 0) < t.preset;
        if (!states[t.name]) tArmed[t.name] = false;
      } else {
        states[t.name] = false;
        tCnt[t.name] = 0;
      }
    } else { // pulse: on rising edge, stay on for preset ticks
      if (raw && !prev) {
        tCnt[t.name] = 0;
        tArmed[t.name] = true;
        states[t.name] = true;
      } else if (tArmed[t.name]) {
        tCnt[t.name] = Math.min((tCnt[t.name] || 0) + 1, t.preset);
        if ((tCnt[t.name] || 0) >= t.preset) {
          states[t.name] = false;
          tArmed[t.name] = false;
        } else {
          states[t.name] = true;
        }
      } else {
        states[t.name] = false;
      }
    }
  });
}

function refreshTimersWithoutTick() {
  // keep outputs consistent with current counters (no increment)
  program.timers.forEach(t => {
    const raw = evalAst(t.inAst, states);
    if (t.kind === 'on') {
      if (!raw) { tCnt[t.name] = 0; states[t.name] = false; }
      else states[t.name] = (tCnt[t.name] || 0) >= t.preset;
    } else if (t.kind === 'off') {
      if (raw) {
        states[t.name] = true;
        tCnt[t.name] = 0;
        tArmed[t.name] = true;
      } else if (tArmed[t.name]) {
        states[t.name] = (tCnt[t.name] || 0) < t.preset;
      } else states[t.name] = false;
    }
    // pulse: only changes on tick / edge
  });
}

function runCycle(doTick) {
  if (doTick) {
    tick++;
    updateTimersFromTick();
  } else {
    refreshTimersWithoutTick();
  }
  if (!settle(program, states)) throw new Error('No converge (oscilación / realimentación)');
}

/* ─── UI helpers ─── */
function showToast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (ok ? ' ok' : '');
  el.style.display = 'block';
}
function hideToast() { document.getElementById('toast').style.display = 'none'; }
function setStatus(s) { document.getElementById('status').textContent = s; }
function setRun(on) {
  const el = document.getElementById('runLabel');
  el.textContent = on ? 'RUN' : 'STOP';
  el.style.color = on ? 'var(--live)' : 'var(--muted)';
}

function loadProgram(text) {
  hideToast();
  program = parseProgram(text);
  states = blankState(program);
  tCnt = {}; tEdge = {}; tArmed = {}; tick = 0;
  program.timers.forEach(t => { tCnt[t.name] = 0; tEdge[t.name] = false; tArmed[t.name] = false; });
  runCycle(false);
  setRun(true);
  document.getElementById('tickLabel').textContent = 't = 0.0 s';
  renderChips();
  drawAll();
  setStatus(`OK · ${program.inputs.length} entradas · ${program.coils.length + program.latches.length + program.timers.length} bloques · 1 paso = 1 s`);
  startClock();
}

function setInput(name, val) {
  states[name] = val;
  try {
    hideToast();
    runCycle(false);
    renderChips();
    drawAll();
    setStatus(`${name} = ${val ? 1 : 0}`);
  } catch (e) {
    showToast(e.message, false);
  }
}

/* ─── Chips ─── */
function renderChips() {
  const box = document.getElementById('chips');
  box.innerHTML = '';
  if (!program) return;
  program.inputs.forEach(name => {
    const b = document.createElement('button');
    b.className = 'chip' + (states[name] ? ' on' : '') + (isMom(name) ? ' mom' : '');
    b.textContent = name;
    if (isMom(name)) {
      b.onpointerdown = e => { e.preventDefault(); setInput(name, true); };
      b.onpointerup = () => setInput(name, false);
      b.onpointerleave = () => { if (states[name]) setInput(name, false); };
    } else {
      b.onclick = () => setInput(name, !states[name]);
    }
    box.appendChild(b);
  });
}

/* ─── Drawing ─── */
const CW = 54, CH = 38, GAPX = 12, GAPY = 8;

function layout(node) {
  if (node.type === 'contact' || node.type === 'not') {
    // not of contact drawn as NC; not of group → treat width of child
    if (node.type === 'not' && node.child.type !== 'contact') {
      const c = layout(node.child);
      return { w: c.w + 16, h: c.h, node, children: [c] };
    }
    return { w: CW, h: CH, node };
  }
  const kids = node.children.map(layout);
  if (node.type === 'and') {
    return {
      w: kids.reduce((s, c) => s + c.w, 0) + GAPX * (kids.length - 1),
      h: Math.max(...kids.map(c => c.h)),
      node, children: kids
    };
  }
  return {
    w: Math.max(...kids.map(c => c.w)) + 22,
    h: kids.reduce((s, c) => s + c.h, 0) + GAPY * (kids.length - 1),
    node, children: kids
  };
}

function wire(x1, y1, x2, y2, on) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? 'var(--live)' : 'var(--ink)'}" stroke-width="${on ? 2.3 : 1.35}"/>`;
}

function drawContact(x, midY, ref, no, closed, parts) {
  const col = closed ? 'var(--live)' : 'var(--ink)';
  const cx = x + CW / 2, L = cx - 6, R = cx + 6;
  parts.push(wire(x, midY, L, midY, closed));
  parts.push(wire(R, midY, x + CW, midY, closed));
  parts.push(`<line x1="${L}" y1="${midY - 8}" x2="${L}" y2="${midY + 8}" stroke="${col}" stroke-width="2.2"/>`);
  parts.push(`<line x1="${R}" y1="${midY - 8}" x2="${R}" y2="${midY + 8}" stroke="${col}" stroke-width="2.2"/>`);
  if (!no) {
    parts.push(`<line x1="${L - 2}" y1="${midY + 9}" x2="${R + 2}" y2="${midY - 9}" stroke="${col}" stroke-width="1.7"/>`);
  }
  parts.push(`<text x="${cx}" y="${midY - 14}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${ref}</text>`);
}

function drawExpr(lay, x, y, st, parts) {
  const midY = y + lay.h / 2;
  const n = lay.node;

  if (n.type === 'contact') {
    const closed = n.no ? !!st[n.ref] : !st[n.ref];
    drawContact(x, midY, n.ref, n.no, closed, parts);
    return;
  }
  if (n.type === 'not' && n.child.type === 'contact') {
    // force NC visual of the child ref
    const ref = n.child.ref;
    const closed = !st[ref]; // inverted sense
    drawContact(x, midY, ref, false, closed, parts);
    return;
  }
  if (n.type === 'not') {
    const cl = lay.children[0];
    drawExpr(cl, x + 8, y + (lay.h - cl.h) / 2, st, parts);
    return;
  }
  if (n.type === 'and') {
    let cx = x;
    lay.children.forEach((cl, i) => {
      drawExpr(cl, cx, y + (lay.h - cl.h) / 2, st, parts);
      if (i < lay.children.length - 1) {
        const on = n.children.slice(0, i + 1).every(c => evalAst(c, st));
        parts.push(wire(cx + cl.w, midY, cx + cl.w + GAPX, midY, on));
        cx += cl.w + GAPX;
      } else cx += cl.w;
    });
    return;
  }
  // or
  const stub = 10;
  let cy = y;
  const ys = [];
  lay.children.forEach(cl => {
    ys.push(cy + cl.h / 2);
    drawExpr(cl, x + stub, cy, st, parts);
    cy += cl.h + GAPY;
  });
  const top = ys[0], bot = ys[ys.length - 1];
  const any = n.children.some(c => evalAst(c, st));
  const rx = x + lay.w - stub;
  parts.push(wire(x, midY, x + stub, midY, any));
  parts.push(wire(x + stub, top, x + stub, bot, any));
  parts.push(wire(rx, top, rx, bot, any));
  parts.push(wire(rx, midY, x + lay.w, midY, any));
  lay.children.forEach((cl, i) => {
    const on = evalAst(n.children[i], st);
    parts.push(wire(x + stub + cl.w, ys[i], rx, ys[i], on));
  });
}

function drawAll() {
  const svg = document.getElementById('svg');
  if (!program) { svg.innerHTML = ''; return; }

  const parts = [];
  // grid + sections
  const ladderX = 720;
  let y = 48;
  const rail = 28;
  const rows = [];

  program.latches.forEach(l => {
    // show SET path as main rung; label SR
    rows.push({ label: l.name, ast: l.setAst, on: !!states[l.name], tag: 'SR' });
  });
  program.coils.forEach(c => {
    rows.push({ label: c.name, ast: c.ast, on: !!states[c.name], tag: null });
  });
  program.timers.forEach(t => {
    const tag = (t.kind === 'off' ? 'TOF ' : t.kind === 'pulse' ? 'TP ' : 'TON ') +
      (tCnt[t.name] || 0) + '/' + t.preset;
    rows.push({ label: t.name, ast: t.inAst, on: !!states[t.name], tag });
  });

  let maxW = 0;
  rows.forEach((row, idx) => {
    const lay = layout(row.ast);
    const rowH = Math.max(lay.h, CH) + 30;
    const midY = y + rowH / 2;
    const ox = ladderX + rail;
    parts.push(`<line x1="${ox}" y1="${y}" x2="${ox}" y2="${y + rowH}" stroke="var(--ink)" stroke-width="2.5"/>`);
    parts.push(`<text x="${ox - 12}" y="${midY + 3}" text-anchor="end" font-family="var(--mono)" font-size="10" fill="var(--muted)">${idx + 1}</text>`);
    drawExpr(lay, ox, y + (rowH - lay.h) / 2, states, parts);
    const coilX = ox + lay.w + 34;
    parts.push(wire(ox + lay.w, midY, coilX - 16, midY, row.on));
    const col = row.on ? 'var(--live)' : 'var(--ink)';
    parts.push(`<circle cx="${coilX}" cy="${midY}" r="15" fill="${row.on ? 'var(--live-soft)' : 'none'}" stroke="${col}" stroke-width="2.1"/>`);
    parts.push(`<text x="${coilX}" y="${y + 13}" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--ink)">${row.label}</text>`);
    if (row.tag) {
      parts.push(`<text x="${coilX}" y="${midY + 4}" text-anchor="middle" font-family="var(--mono)" font-size="8" fill="var(--muted)">${row.tag}</text>`);
    }
    parts.push(`<line x1="${coilX + 16}" y1="${y}" x2="${coilX + 16}" y2="${y + rowH}" stroke="var(--ink)" stroke-width="2.5"/>`);
    maxW = Math.max(maxW, coilX + 40);
    y += rowH;
  });

  // —— Field + LOGO (left) ——
  const field = drawField(program, states);
  const totalH = Math.max(y + 40, field.h + 20, 520);
  const totalW = Math.max(maxW + 20, 1180);

  const bg = `
    <defs>
      <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1.05" fill="var(--grid)"/>
      </pattern>
    </defs>
    <rect width="${totalW}" height="${totalH}" fill="url(#g)"/>
    <text x="36" y="26" font-family="var(--mono)" font-size="10" fill="var(--muted)" letter-spacing="0.04em">CABLEADO · LOGO!</text>
    <text x="${ladderX + rail}" y="26" font-family="var(--mono)" font-size="10" fill="var(--muted)" letter-spacing="0.04em">KOP / ESCALERA</text>
    <text x="${ladderX + rail}" y="42" text-anchor="middle" font-family="var(--mono)" font-size="11" font-weight="600" fill="var(--ink)">L+</text>
  `;

  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.innerHTML = bg + field.svg + parts.join('');

  // bind click handlers on field inputs via data attributes — re-query
  svg.querySelectorAll('[data-in]').forEach(el => {
    const name = el.getAttribute('data-in');
    if (isMom(name)) {
      el.style.cursor = 'pointer';
      el.onpointerdown = e => { e.preventDefault(); setInput(name, true); };
      el.onpointerup = () => setInput(name, false);
      el.onpointerleave = () => { if (states[name]) setInput(name, false); };
    } else {
      el.style.cursor = 'pointer';
      el.onclick = () => setInput(name, !states[name]);
    }
  });
}

function drawField(prog, st) {
  const parts = [];
  const Lx = 36, Nx = 640;
  const logoX = 310, logoY = 56, logoW = 200, logoH = 268;
  const inputs = prog.inputs.slice(0, 8);

  // rails
  parts.push(`<line x1="${Lx}" y1="48" x2="${Lx}" y2="480" stroke="var(--phase)" stroke-width="3"/>`);
  parts.push(`<text x="${Lx}" y="44" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--phase)" font-weight="600">L+</text>`);
  parts.push(`<line x1="${Nx}" y1="48" x2="${Nx}" y2="480" stroke="var(--neutral)" stroke-width="3"/>`);
  parts.push(`<text x="${Nx}" y="44" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="var(--neutral)" font-weight="600">M</text>`);

  // LOGO body
  parts.push(`<rect x="${logoX}" y="${logoY}" width="${logoW}" height="${logoH}" rx="7" fill="var(--logo)"/>`);
  parts.push(`<text x="${logoX + logoW / 2}" y="${logoY + 20}" text-anchor="middle" fill="#eef1f3" font-family="var(--sans)" font-size="12" font-weight="700">SIEMENS LOGO!</text>`);
  parts.push(`<rect x="${logoX + 16}" y="${logoY + 32}" width="${logoW - 32}" height="32" rx="3" fill="#151c22"/>`);
  const active = [
    ...prog.latches.map(l => l.name),
    ...prog.coils.map(c => c.name),
    ...prog.timers.map(t => t.name)
  ].filter(n => st[n]);
  parts.push(`<text x="${logoX + logoW / 2}" y="${logoY + 52}" text-anchor="middle" fill="#8fdbb0" font-family="var(--mono)" font-size="11">${active.length ? active.slice(0, 4).join(' ') : 'IDLE'}</text>`);

  // I terminals strip
  parts.push(`<text x="${logoX + 14}" y="${logoY + 84}" fill="#9aa7b2" font-family="var(--mono)" font-size="8">ENTRADAS</text>`);
  inputs.forEach((name, i) => {
    const on = !!st[name];
    const tx = logoX + 12 + (i % 4) * 46;
    const ty = logoY + 92 + Math.floor(i / 4) * 26;
    parts.push(`<rect x="${tx}" y="${ty}" width="40" height="18" rx="2" fill="${on ? 'var(--live-soft)' : '#2a333c'}" stroke="${on ? 'var(--live)' : '#1a2228'}"/>`);
    parts.push(`<text x="${tx + 20}" y="${ty + 13}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="${on ? 'var(--live)' : '#a8b4c0'}">I${i + 1}</text>`);
  });

  // Q strip — first coils/latches/timers as outputs
  const outs = [
    ...prog.latches.map(l => l.name),
    ...prog.coils.map(c => c.name),
    ...prog.timers.map(t => t.name)
  ].slice(0, 4);
  parts.push(`<text x="${logoX + 14}" y="${logoY + 160}" fill="#9aa7b2" font-family="var(--mono)" font-size="8">SALIDAS</text>`);
  outs.forEach((name, i) => {
    const on = !!st[name];
    const tx = logoX + 12 + i * 46;
    const ty = logoY + 168;
    parts.push(`<rect x="${tx}" y="${ty}" width="40" height="18" rx="2" fill="${on ? 'var(--live-soft)' : '#2a333c'}" stroke="${on ? 'var(--live)' : '#1a2228'}"/>`);
    parts.push(`<text x="${tx + 20}" y="${ty + 13}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="${on ? 'var(--live)' : '#a8b4c0'}">Q${i + 1}</text>`);
  });
  parts.push(`<text x="${logoX + logoW / 2}" y="${logoY + logoH - 14}" text-anchor="middle" fill="#8fdbb0" font-family="var(--mono)" font-size="9">RUN</text>`);

  // power feed
  parts.push(`<line x1="${Lx}" y1="${logoY + 18}" x2="${logoX}" y2="${logoY + 18}" stroke="var(--phase)" stroke-width="2"/>`);
  parts.push(`<line x1="${Nx}" y1="${logoY + 36}" x2="${logoX + logoW}" y2="${logoY + 36}" stroke="var(--neutral)" stroke-width="2"/>`);

  // input devices
  inputs.forEach((name, i) => {
    const yy = 78 + i * 34;
    const on = !!st[name];
    const col = on ? 'var(--live)' : 'var(--ink)';
    const cx = 140;
    parts.push(`<g data-in="${name}">`);
    parts.push(wire(Lx, yy, cx - 20, yy, on));
    parts.push(`<line x1="${cx - 20}" y1="${yy - 9}" x2="${cx - 20}" y2="${yy + 9}" stroke="${col}" stroke-width="2.1"/>`);
    parts.push(`<line x1="${cx + 4}" y1="${yy - 9}" x2="${cx + 4}" y2="${yy + 9}" stroke="${col}" stroke-width="2.1"/>`);
    parts.push(`<line x1="${cx - 20}" y1="${yy}" x2="${cx + 4}" y2="${on ? yy : yy - 10}" stroke="${col}" stroke-width="1.7"/>`);
    parts.push(`<text x="${cx - 8}" y="${yy - 14}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${name}</text>`);
    parts.push(wire(cx + 4, yy, logoX, yy, on));
    parts.push(`<text x="${logoX - 4}" y="${yy - 4}" text-anchor="end" font-family="var(--mono)" font-size="8" fill="var(--muted)">I${i + 1}</text>`);
    // hit area
    parts.push(`<rect x="${cx - 28}" y="${yy - 18}" width="48" height="32" fill="transparent"/>`);
    parts.push(`</g>`);
  });

  // output lamps under LOGO
  outs.forEach((name, i) => {
    const yy = logoY + logoH + 40 + i * 48;
    const on = !!st[name];
    const col = on ? 'var(--live)' : 'var(--ink)';
    const qx = logoX + 24 + i * 46;
    const lx = 480;
    parts.push(wire(qx, logoY + logoH, qx, yy, on));
    parts.push(wire(qx, yy, lx - 14, yy, on));
    parts.push(`<circle cx="${lx}" cy="${yy}" r="13" fill="${on ? 'var(--live-soft)' : 'none'}" stroke="${col}" stroke-width="2"/>`);
    parts.push(`<line x1="${lx - 9}" y1="${yy - 9}" x2="${lx + 9}" y2="${yy + 9}" stroke="${col}" stroke-width="1.5"/>`);
    parts.push(`<line x1="${lx + 9}" y1="${yy - 9}" x2="${lx - 9}" y2="${yy + 9}" stroke="${col}" stroke-width="1.5"/>`);
    parts.push(`<text x="${lx}" y="${yy - 18}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${name}</text>`);
    parts.push(wire(lx + 14, yy, Nx, yy, on));
    parts.push(`<text x="${qx}" y="${logoY + logoH + 12}" text-anchor="middle" font-family="var(--mono)" font-size="8" fill="var(--muted)">Q${i + 1}</text>`);
  });

  const h = logoY + logoH + 40 + Math.max(outs.length, 1) * 48 + 20;
  return { svg: parts.join(''), h };
}

/* ─── Controls ─── */
document.getElementById('btnParse').onclick = () => {
  try {
    loadProgram(document.getElementById('src').value);
  } catch (e) {
    showToast(e.message, false);
    setRun(false);
    setStatus('Error de sintaxis');
  }
};

document.getElementById('btnReset').onclick = () => {
  if (!program) return;
  states = blankState(program);
  tCnt = {}; tEdge = {}; tArmed = {}; tick = 0;
  program.timers.forEach(t => { tCnt[t.name] = 0; tEdge[t.name] = false; tArmed[t.name] = false; });
  try {
    hideToast();
    runCycle(false);
    document.getElementById('tickLabel').textContent = 't = 0.0 s';
    renderChips();
    drawAll();
    setStatus('Reiniciado');
    if (!clockOn) startClock();
  } catch (e) {
    showToast(e.message, false);
  }
};

document.getElementById('btnTick').onclick = () => {
  if (!program) return;
  toggleClock();
  setStatus(clockOn ? 'Reloj automático ON (1 s / paso)' : 'Reloj en pausa');
};

document.getElementById('examples').onchange = (e) => {
  const k = e.target.value;
  if (!k || !EXAMPLES[k]) return;
  document.getElementById('src').value = EXAMPLES[k];
  try {
    loadProgram(EXAMPLES[k]);
  } catch (err) {
    showToast(err.message, false);
  }
  e.target.value = '';
};

// Ctrl+Enter to parse
document.getElementById('src').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('btnParse').click();
  }
});

// boot — secuencia de bombillas + reloj automático
document.getElementById('src').value = EXAMPLES.lights;
try { loadProgram(EXAMPLES.lights); }
catch (e) { showToast(e.message, false); }
</script>
